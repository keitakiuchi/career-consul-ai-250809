# ------------------------------------------------------------
# 目的:
#   - AI駆動コーディングプロジェクトの汎用的なClaude設定
#   - 様々なプロジェクトタイプに対応した開発支援
#   - コード品質とベストプラクティスの実装
# ------------------------------------------------------------

system_prompt: |
  # AI駆動コーディング プロジェクト構造
  1. **プロジェクトの基本構造** を理解し、適切なディレクトリ配置を提案する。
     - ソースコード: `src/` または `app/` ディレクトリ
     - テスト: `tests/` ディレクトリ
     - 設定ファイル: `config/` ディレクトリ
     - ドキュメント: `docs/` ディレクトリ
     - スクリプト: `scripts/` ディレクトリ
     - ユーティリティ: `utility/` ディレクトリ
  
  # 環境チェック（重要）
  2. **コード実行前の環境チェック** を必ず実行する。
     - 仮想環境の確認: `conda activate py-review` または適切な環境
     - 環境チェックスクリプトの実行: `python utility/check_env.py`
     - 依存関係の確認: `pip install -r requirements.txt`
     - 環境変数の設定: APIキーは `.env` ファイルで管理
  
  # 開発プロセス
  3. **テスト駆動開発（TDD）** を推奨する。
     - Red: 失敗するテストを書く
     - Green: テストを通す最小限のコードを書く
     - Refactor: コードを改善する
  4. **継続的リファクタリング** を実践する。
     - 小さな変更を頻繁に行う
     - テストが通ることを確認
     - 意味のある名前を使用
     - 重複を除去する
  
  # コード品質とテスト
  5. **コード品質標準** に従う。
     - 言語固有のコーディング規約（PEP 8 for Python, ESLint for JavaScript等）
     - 適切なdocstring/コメント記述
     - 型ヒントの使用（可能な場合）
     - エラーハンドリングの実装
  6. **テスト戦略** を実装する。
     - 単体テストの作成
     - 統合テストの実装
     - CI/CDパイプラインでの自動テスト
     - モックオブジェクトの活用

  # パフォーマンスとセキュリティ
  7. **パフォーマンス最適化** を考慮する。
     - 効率的なアルゴリズムの選択
     - キャッシュ機能の実装
     - 不要な処理の削減
     - メモリ使用量の最適化
  8. **セキュリティ** を重視する。
     - APIキーは環境変数で管理
     - 機密情報のGit管理を避ける
     - 入力値の検証
     - 定期的なセキュリティ監査の実施

  # ファイル編集ガイドライン
  9. **新しい機能の追加** 時:
      - 適切なディレクトリにファイルを作成
      - 基本クラス/関数構造を実装
      - 設定ファイルの更新
      - 適切なテストを追加
  10. **設定の追加** 時:
      - 設定ファイルの適切な形式（JSON, YAML, TOML等）を使用
      - 環境変数の設定を確認
      - デフォルト値の提供

  # エラーハンドリングとログ
  11. **エラーハンドリング** を適切に実装する。
      - 適切な例外処理
      - ログ出力の追加
      - リトライ機能の実装
      - ユーザーフレンドリーなエラーメッセージ

  # ドキュメントとコミット
  12. **ドキュメント** を適切に管理する。
      - README.mdの更新
      - APIドキュメントの作成
      - コードコメントの追加
  13. **コミット管理** を適切に行う。
      - 機能単位でのコミット
      - 意味のあるコミットメッセージ
      - 適切なブランチ戦略

# ---- ★ allowed_tools を改行区切りに修正 ★ ----
allowedTools: |
  Bash(:)
  Edit
  mcp__github_file_ops__commit_files

timeout_minutes: 30
concurrency:
  group: "claude"
  cancel-in-progress: false
